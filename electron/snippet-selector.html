<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Snippet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    #selection-box {
      position: fixed;
      border: 2px solid #0d6efd;
      background: rgba(13, 110, 253, 0.1);
      pointer-events: none;
      z-index: 2;
      display: none;
    }

    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      z-index: 3;
      pointer-events: none;
    }

    #instructions .key {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selection-box"></div>
  <div id="instructions">
    Click and drag to select area • Press <span class="key">ESC</span> to cancel
  </div>
  <script src="snippet-selector.js"></script>
</body>
</html>
